<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #4169E1;       /* Azul Royal */
            --primary-hover: #2e4fa3;       /* Azul Royal Escuro */
            --primary-light: #eef2ff;       /* Azul Royal Ultra Claro */
            --text-main: #1e293b;           /* Cinza Escuro quase preto */
            --text-muted: #64748b;          /* Cinza Médio */
            --bg-body: #f8fafc;             /* Fundo do site levemente cinza */
            --border-color: #cbd5e1;        /* Borda padrão */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            background-color: #ffffff;
            padding: 45px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 440px;
            border: 1px solid #edf2f7;
        }

        /* Logotipo ou Ícone da Empresa */
        .brand-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo i {
            font-size: 36px;
            color: var(--primary-color);
            background-color: var(--primary-light);
            padding: 16px;
            border-radius: 12px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h2 {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
        }

        /* Container do Input com Ícone */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 16px;
            transition: color 0.2s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #fff;
            transition: all 0.2s ease;
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
        }

        /* Efeito de foco profissional */
        .input-wrapper input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(65, 105, 225, 0.15);
            outline: none;
        }

        .input-wrapper input:focus + i {
            color: var(--primary-color);
        }

        /* Opções extras (Lembrar/Esqueceu) */
        .auth-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .checkbox-label {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input {
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .auth-actions a, .toggle-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .auth-actions a:hover, .toggle-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Botão Principal Em bloco */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(65, 105, 225, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 10px 15px -3px rgba(65, 105, 225, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* Rodapé de alternância */
        .auth-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
            color: var(--text-muted);
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
        }

        /* Classe utilitária para esconder telas via JS se necessário */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="login-card">
        <div class="brand-logo">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        
        <div class="auth-header">
            <h2>Acessar sua conta</h2>
            <p>Insira suas credenciais corporativas</p>
        </div>

        <form onsubmit="autenticarEEntrar(event)">
            <div class="form-group">
                <label for="login-email">E-mail Corporativo</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="nome@empresa.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="login-password">Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="auth-actions">
                <label class="checkbox-label">
                    <input type="checkbox"> Lembrar neste dispositivo
                </label>
                <a href="#">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-submit">Entrar no sistema</button>

            <div class="auth-footer">
                <p>Novo por aqui? <a href="#" class="toggle-link" onclick="toggleCard()">Criar uma conta</a></p>
            </div>
        </form>
    </div>

    <div class="auth-container hidden" id="register-card">
        <div class="brand-logo">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        
        <div class="auth-header">
            <h2>Comece agora</h2>
            <p>Crie sua conta de acesso em poucos passos</p>
        </div>

        <form onsubmit="autenticarEEntrar(event)">
            <div class="form-group">
                <label for="reg-name">Nome Completo</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="reg-name" placeholder="Ex: João Silva" required>
                </div>
            </div>

            <div class="form-group">
                <label for="reg-email">E-mail</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="reg-email" placeholder="seu@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="reg-password">Senha de Acesso</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres" required>
                </div>
            </div>

            <div class="auth-actions">
                <label class="checkbox-label" style="align-items: flex-start;">
                    <input type="checkbox" required>
                    <span>Aceito os <a href="#">Termos de Serviço</a> e <a href="#">Políticas de Privacidade</a>.</span>
                </label>
            </div>

            <button type="submit" class="btn-submit">Finalizar Cadastro</button>

            <div class="auth-footer">
                <p>Já possui cadastro? <a href="#" class="toggle-link" onclick="toggleCard()">Fazer Login</a></p>
            </div>
        </form>
    </div>

    <script>
        // Altera entre os cards de Login e Cadastro
        function toggleCard() {
            document.getElementById('login-card').classList.toggle('hidden');
            document.getElementById('register-card').classList.toggle('hidden');
        }

        // Função responsável por conectar com o seu site index.html
        function autenticarEEntrar(event) {
            event.preventDefault(); // Evita que a página pisque sem executar a ação
            
            // Redireciona o usuário para o arquivo index.html
            // Certifique-se de que este arquivo de login está na mesma pasta do seu index.html
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
